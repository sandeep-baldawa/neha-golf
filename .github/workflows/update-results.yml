name: Update golf results

on:
  schedule:
    # 13:10 UTC ≈ 6:10 AM Pacific, daily.
    - cron: "10 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-updater.txt

      - name: Check public result pages
        run: python scripts/update-results.py

      # Allowed to fail without losing any results the step above found. A
      # parse failure still turns the run red, at the end.
      - name: Refresh rankings
        id: rankings
        continue-on-error: true
        run: python scripts/fetch-rankings.py

      - name: Commit any changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "results-updater"
          git config user.email "actions@github.com"
          git add script.js data/update-log.json data/review-needed.json
          git commit -m "Update tournament results and rankings"
          git push

      - name: Surface a ranking parse failure
        if: steps.rankings.outcome == 'failure'
        run: |
          echo "fetch-rankings.py could not read one of the ranking sources."
          echo "See the 'Refresh rankings' step above for which one and why."
          exit 1
